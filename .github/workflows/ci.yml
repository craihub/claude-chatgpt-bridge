name: Test and inspect release
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development dependencies
        run: python -m pip install '.[dev]'
      - name: Prepare public tokenizer data
        run: python -c "import tiktoken; tiktoken.get_encoding('o200k_base')"
      - name: Run synthetic tests
        run: python -m pytest -q
      - name: Check source and history
        run: python scripts/check_public.py
      - name: Build and inspect artifacts
        run: python scripts/build_release.py
      - name: Audit third-party dependencies
        run: |
          python -m pip freeze --exclude claude-chatgpt-bridge > /tmp/bridge-dependencies.txt
          python -m pip_audit -r /tmp/bridge-dependencies.txt --no-deps --disable-pip

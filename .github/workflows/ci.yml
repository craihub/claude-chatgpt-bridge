name: Test and inspect release
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Validate the contributor's exact commit. GitHub's temporary PR
          # merge adds account metadata that is not part of the public source.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development dependencies
        run: python -m pip install '.[dev]'
      - name: Prepare public tokenizer data
        run: python -c "import tiktoken; tiktoken.get_encoding('o200k_base')"
      - name: Run synthetic tests
        run: python -m pytest -q
      - name: Check source and history
        run: python scripts/check_public.py
      - name: Test installer entry point
        run: python install.py --help
      - name: Build and inspect artifacts
        run: python scripts/build_release.py
      - name: Audit third-party dependencies
        shell: bash
        run: |
          python -m pip freeze --exclude claude-chatgpt-bridge > "$RUNNER_TEMP/bridge-dependencies.txt"
          python -m pip_audit -r "$RUNNER_TEMP/bridge-dependencies.txt" --no-deps --disable-pip
